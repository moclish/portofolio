    <!-- Prevent theme flash & layout shift before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Favicon -->
    <link
      id="app-favicon"
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23047857'/><text x='50%' y='55%' font-size='50' font-family='serif' fill='white' text-anchor='middle' dominant-baseline='central'>س</text></svg>"
    />
